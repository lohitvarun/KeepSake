{% extends "base.html" %}{% block title %}Settings{% endblock %}{% block content %}<div class="page-heading"><div><p class="eyebrow">MAKE THIS SPACE YOURS</p><h1>Settings</h1></div></div><form method="post" class="form-card"><h3>Appearance</h3><label>Theme<select name="theme"><option value="light" {{ 'selected' if theme=='light' else '' }}>Light</option><option value="dark" {{ 'selected' if theme=='dark' else '' }}>Dark</option></select></label><button class="button">Save appearance</button></form><form method="post" action="{{ url_for('profile') }}" class="form-card"><h3>Profile</h3><label>Name<input name="name" value="{{ user['name'] }}" required></label><label>Gender<select name="gender">{% for g in ['Male','Female','Non-binary','Prefer not to say'] %}<option {{ 'selected' if user['gender']==g else '' }}>{{ g }}</option>{% endfor %}</select></label><label>Email<input value="{{ user['email'] }}" disabled></label><p class="muted">Account created {{ user['created_at'][:10] }}</p><button class="button">Update profile</button></form>{% endblock %}
