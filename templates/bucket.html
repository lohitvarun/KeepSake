{% extends "base.html" %}{% block title %}Bucket list{% endblock %}{% block content %}<div class="page-heading"><div><p class="eyebrow">THINGS YOU WANT TO EXPERIENCE</p><h1>Bucket list</h1></div></div><form method="post" class="inline-form"><input name="title" placeholder="Something you want to do…" required><input name="category" placeholder="Category"><input type="date" name="target_date"><button class="button">Add to list</button></form><div class="simple-list">{% for i in items %}<div class="list-row"><form method="post" action="{{ url_for('bucket_toggle',item_id=i['id']) }}"><button class="check-button">{{ '✓' if i['completed'] else '○' }}</button></form><div class="{{ 'completed' if i['completed'] else '' }}"><b>{{ i['title'] }}</b><small>{{ i['category'] }} · {{ i['target_date'] }}</small></div></div>{% else %}<p class="muted">Your someday list starts with one idea.</p>{% endfor %}</div>{% endblock %}
