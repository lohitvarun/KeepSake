{% extends "base.html" %}{% block title %}Share link created{% endblock %}{% block content %}<div class="empty-state"><div class="empty-icon">↗</div><h2>Your private link is ready</h2><p>Anyone with this link can view the entry. Share it only with someone you trust.</p><input id="shareLink" value="{{ url }}" readonly><button class="button" onclick="navigator.clipboard.writeText(document.getElementById('shareLink').value).then(()=>alert('Link copied'))">Copy link</button><p><a href="{{ url_for('privacy') }}">Manage sharing links</a></p></div>{% endblock %}
