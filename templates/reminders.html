{% extends "base.html" %}{% block title %}Reminders{% endblock %}{% block content %}<div class="page-heading"><div><p class="eyebrow">A GENTLE NUDGE</p><h1>Reminders</h1><p class="muted">Create reminders for your own reference.</p></div></div><form method="post" class="inline-form"><input name="title" placeholder="Reminder" required><input type="date" name="remind_date" required><button class="button">Add reminder</button></form><div class="simple-list">{% for r in reminders %}<div class="list-row"><span>◷</span><div><b>{{ r['title'] }}</b><small>{{ r['remind_date'] }}</small></div></div>{% else %}<p class="muted">No reminders yet.</p>{% endfor %}</div>{% endblock %}
